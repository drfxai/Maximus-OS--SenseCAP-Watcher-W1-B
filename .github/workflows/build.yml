name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test worker/test/*.test.js

  ui-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 --branch v8.4.0 https://github.com/lvgl/lvgl.git .sim-deps/lvgl
          pip install pillow
          make -C sim
          mkdir -p out && ./sim/render out
          python3 tools/sim_montage.py out screens.png 5
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: screens.png

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.2.3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch board support package
        run: |
          git config --global --add safe.directory '*'
          tools/fetch-deps.sh
      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          # static RAM use, to compare releases when the screen stays dark
          idf.py size
          idf.py size-components > size.txt; head -45 size.txt
          # the first 9 hex digits match "ELF file SHA256" in a crash report
          sha256sum build/*.elf
      - name: Decode crash backtraces (tools/backtrace.txt, if present)
        if: hashFiles('tools/backtrace.txt') != ''
        shell: bash
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          grep -oE '0x4[0-9a-f]{7}' ../tools/backtrace.txt | sort -u | xargs xtensa-esp32s3-elf-addr2line -pfiaC -e build/maximus_os.elf
      - name: Merge into one image (bootloader + partition table + app)
        shell: bash
        working-directory: firmware/build
        run: |
          . $IDF_PATH/export.sh
          mkdir -p ../../site/firmware
          esptool.py --chip esp32s3 merge_bin -o ../../site/firmware/maximus-os-full.bin @flash_args
          # the ELF goes alongside, so a crash backtrace from the web console can be decoded
          cp *.elf ../../site/firmware/maximus-os.elf
          ls -l ../../site/firmware
          size=$(stat -c %s ../../site/firmware/maximus-os-full.bin)
          echo "full image: $size bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: maximus-os-site
          path: site
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: site/firmware/maximus-os-full.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    if: github.ref == 'refs/heads/main'
    needs: [firmware, worker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maximus-os-site
          path: site
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: github.ref == 'refs/heads/main'
    needs: [firmware, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: maximus-os-site
          path: site
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Maximus OS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Maximus OS firmware for the SenseCAP Watcher W1-B (commit ${{ github.sha }}).

            **Easiest:** use the web installer at https://drfxai.github.io/Maximus-OS--SenseCAP-Watcher-W1-B/ (Chrome or Edge).

            **Manual flash** of `maximus-os-full.bin` (bootloader, partition table and app in one file, flash at offset 0x0):

            ```
            esptool.py --chip esp32s3 --port <PORT> --baud 460800 erase_flash
            esptool.py --chip esp32s3 --port <PORT> --baud 460800 write_flash 0x0 maximus-os-full.bin
            ```
          files: site/firmware/maximus-os-full.bin
